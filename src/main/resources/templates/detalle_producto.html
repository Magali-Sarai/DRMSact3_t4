<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Detalle</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; background: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.08); }
        .ok { background: #dcfce7; color: #166534; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; }
        .btn { display: inline-block; margin-top: 15px; padding: 10px 16px; background: #2563eb; color: white; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>
<div class="card">
    <h2 th:text="${titulo}">Detalle del Producto</h2>

    <div class="ok" th:if="${mensaje != null}" th:text="${mensaje}"></div>

    <div th:if="${producto != null}">
        <p><strong>ID:</strong> <span th:text="${producto.id}"></span></p>
        <p><strong>Nombre:</strong> <span th:text="${producto.nombre}"></span></p>
        <p><strong>Categoría:</strong> <span th:text="${producto.categoria}"></span></p>
        <p><strong>Precio:</strong> $<span th:text="${producto.precio}"></span> MXN</p>
    </div>

    <div th:if="${producto == null}">
        <p style="color: #dc2626;">No existe un producto con el ID: <b th:text="${idBuscado}"></b></p>
    </div>

    <a class="btn" th:href="@{/productos/lista}">Volver al listado</a>
</div>
</body>
</html>
