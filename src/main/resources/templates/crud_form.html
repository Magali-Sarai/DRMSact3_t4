<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tituloFormulario}">Formulario Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 620px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0" th:text="${tituloFormulario}">Formulario</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/crud/guardar}" th:object="${producto}" method="post">
                <!-- Campo oculto ID para que al editar actualice el registro existente en lugar de duplicarlo -->
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre del Producto:</label>
                    <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej. Switch Cisco Catalyst 2960" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Precio (MXN):</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{precio}" placeholder="Ej. 3250.00" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Stock disponible:</label>
                        <input type="number" class="form-control" th:field="*{stock}" placeholder="Ej. 10" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Categoría (Llave Foránea <code>categoria_id</code>):</label>
                    <select name="categoriaId" class="form-select" required>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.id}"
                                th:text="${cat.id + ' - ' + cat.nombre + ' (' + cat.descripcion + ')'}"
                                th:selected="${producto.categoria != null and producto.categoria.id == cat.id}">
                        </option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/crud/productos}" class="btn btn-secondary">← Cancelar / Volver</a>
                    <button type="submit" class="btn btn-success fw-bold">Guardar en MySQL</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
